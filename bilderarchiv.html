<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bilderarchiv | VfB Annweiler 1919 e.V.</title>
<link rel="stylesheet" href="styles.css">
<script src="navigation.js" defer></script>
<script src="footer.js" defer></script>
</head>
<body>
<div id="site-nav"></div>
<section class="hero page-hero">
  <div class="container">
    <div class="hero-eyebrow">VfB Annweiler seit 1919</div>
    <h1>Bilder<span>archiv</span></h1>
    <p class="hero-sub">Historische Mannschaften, besondere Momente und die Geschichte des Vereins in Bildern.</p>
  </div>
</section>
<section class="section-bilderarchiv">
  <div class="container">
    <div class="section-label">Historische Sammlung</div>
    <h2 class="section-title">Aus dem Vereinsarchiv</h2>
    <div class="bildarchiv-carousel">
      <div class="bildarchiv-carousel-viewport" id="bildarchiv-carousel" aria-live="polite">
        <div class="bildarchiv-carousel-track"></div>
      </div>
      <div class="bildarchiv-carousel-controls" id="bildarchiv-carousel-controls">
        <button class="carousel-button carousel-button--prev" type="button" aria-label="Vorheriges Bild"></button>
        <div class="carousel-dots" id="bildarchiv-carousel-dots" role="tablist" aria-label="Bild auswählen"></div>
        <button class="carousel-button carousel-button--next" type="button" aria-label="Nächstes Bild"></button>
      </div>
    </div>
  </div>
</section>
<div id="site-footer"></div>
<script src="bildarchiv.js" defer></script>
</body>
</html>
